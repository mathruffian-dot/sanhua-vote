<!doctype html>
<html lang="zh-Hant-TW" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今天，你是哪朵花？</title>
<meta name="description" content="〈愛蓮說〉情境遊戲：每題三種做法，全班投完一起揭曉是哪朵花，最後做出自己的三花箋與 AI 花束。">
<meta name="theme-color" content="#f4f0e6">
<link rel="stylesheet" href="../../assets/style.css?v=20261120k">
<link rel="stylesheet" href="../game.css?v=20261120k">
<script src="../../assets/config.js"></script>
</head>
<body class="g-body">
<main class="g-wrap" id="main">
  <div id="app"></div>
  <div class="err" id="err" role="alert"></div>
</main>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="存花箋">
  <div><img id="sheetImg" alt="我的三花箋"><p><b>長按圖片 → 選「加入照片」</b></p><p class="small">存好之後，點下面的按鈕回去</p><button class="btn" id="sheetClose" type="button">回去</button></div>
</div>

<script src="../../assets/common.js?v=20261120k"></script>
<script src="../scenes.js?v=20261120k"></script>
<script>
const $ = id => document.getElementById(id);
const app = $('app');
const put = (...k) => app.replaceChildren(...k.filter(x => x != null));   // 略過 null，不會印出「null」
const dev = deviceId();
const GIMG = new URL('../img/', location.href).href;
const sceneImg = id => GIMG + 'scene_' + id + '.webp';
const flowerImg = f => GIMG + 'flower_' + f + '.webp';
const styleImg = s => GIMG + 'style_' + s + '.webp';
const F3 = ['lian', 'ju', 'mudan'];

let code = (new URLSearchParams(location.search).get('c') || '').replace(/\D/g, '').slice(0, 6);
let st = null, view = '', timer = null, pick = { choice: null, guess: null }, sending = false, seatPick = null, reseat = false, lastStep = '';

function setErr(m) { $('err').textContent = m || ''; }
const sum3 = c => (c.ju || 0) + (c.mudan || 0) + (c.lian || 0);

function brand() {
  return el('div', { class: 'g-head' },
    el('div', { class: 'g-brand' },
      el('div', { class: 'trio' }, ...F3.map(f => el('img', { src: flowerImg(f), alt: '', class: '', style: `--c:${GAME_FLOWER[f].color}` }))),
      el('div', {}, el('b', {}, '今天，你是哪朵花？'), el('small', {}, '〈愛蓮說〉情境遊戲'))),
    st && st.me ? el('span', { class: 'chip seat' }, `${st.me.seat} 號`) : null);
}

function dots() {
  const n = st.deck.length;
  const d = el('div', { class: 'dots', 'aria-label': `第 ${st.qi + 1} 題，共 ${n} 題` });
  for (let i = 0; i < n; i++) d.append(el('i', { class: i < st.qi ? 'done' : i === st.qi ? 'now' : '' }));
  d.append(el('span', {}, `第 ${st.qi + 1} / ${n} 題`));
  return d;
}

// ---------- 輸入代號 ----------
function renderCode(msg) {
  view = 'code';
  const inp = el('input', { type: 'text', inputmode: 'numeric', maxlength: '6', class: 'code-input', placeholder: '000000', 'aria-label': '遊戲代號', autocomplete: 'off' });
  const go = el('button', { class: 'btn block', type: 'button' }, '進入遊戲');
  const enter = () => { const v = inp.value.replace(/\D/g, ''); if (v.length !== 6) return setErr('代號是 6 個數字'); code = v; history.replaceState(null, '', '?c=' + v); start(); };
  go.addEventListener('click', enter);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
  put(
    el('div', { class: 'paper join-hero' },
      el('div', { class: 'flowers' }, ...F3.map(f => el('img', { src: flowerImg(f), alt: GAME_FLOWER[f].long, style: `--c:${GAME_FLOWER[f].color}` }))),
      el('h1', {}, '今天，你是哪朵花？'),
      el('p', { class: 'muted' }, '輸入老師螢幕上的 6 位數代號'),
      inp, el('div', { style: 'height:12px' }), go));
  setErr(msg || '');
  inp.focus();
}

// ---------- 選座號 ----------
function renderSeat() {
  const key = 'seat' + st.seats.join(',');
  if (view === key) return;
  view = key;
  const mySeat = st.me ? st.me.seat : null;
  const max = Math.max(40, ...st.seats);
  const grid = el('div', { class: 'seats', role: 'group', 'aria-label': '座號' });
  const ok = el('button', { class: 'btn block mudan', type: 'button', disabled: seatPick ? false : true }, seatPick ? `我是 ${seatPick} 號，加入` : '先點你的座號');
  for (let i = 1; i <= max; i++) {
    const taken = st.seats.includes(i) && i !== mySeat;
    const b = el('button', { type: 'button', 'aria-pressed': String(seatPick === i), disabled: taken }, String(i));
    b.addEventListener('click', () => {
      seatPick = i;
      grid.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      ok.disabled = false; ok.textContent = `我是 ${i} 號，加入`;
    });
    grid.append(b);
  }
  if (seatPick && st.seats.includes(seatPick) && seatPick !== mySeat) { seatPick = null; ok.disabled = true; ok.textContent = '先點你的座號'; }
  ok.addEventListener('click', async () => {
    ok.disabled = true; setErr('');
    try { await api(`/api/game/${code}/join`, { body: { device: dev, seat: seatPick } }); reseat = false; view = ''; await poll(); }
    catch (e) { setErr(e.message); ok.disabled = false; view = ''; poll(); }
  });
  put(brand(),
    el('div', { class: 'paper' },
      el('img', { class: 'seat-art', src: '../../assets/img/hero-800.webp', alt: '' }),
      el('h2', { class: 'sec-title' }, el('span', { class: 'no' }, '座'), '點你的座號', el('small', {}, '不用填名字，灰色的是已經有人選了')),
      grid),
    el('div', { class: 'send-row' }, ok),
    ...(reseat ? [el('div', { class: 'wait-note' }, el('button', { class: 'btn ghost small', type: 'button', onclick: () => { reseat = false; view = ''; poll(); } }, '不換了，回去'))] : []));
}

// ---------- 等老師開始 ----------
function renderLobby() {
  if (view !== 'lobby') {
    view = 'lobby';
    put(brand(),
      el('div', { class: 'paper lobby-big' },
        el('div', { class: 'lobby-art' }, el('img', { src: '../../assets/img/hero-800.webp', srcset: '../../assets/img/hero-800.webp 800w, ../../assets/img/hero-1600.webp 1600w', sizes: '(max-width: 900px) 100vw, 880px', alt: '陶淵明與菊、楊貴妃與牡丹、周敦頤與蓮的工筆長卷' })),
        el('div', { class: 'seatno' }, String(st.me.seat), el('small', {}, '號')),
        el('h2', { style: 'margin:14px 0 4px' }, '加入成功！等老師開始'),
        el('p', { class: 'muted', id: 'lobbyN' }, ''),
        el('p', { class: 'fine' }, '玩法：每一題是一個 2026 年的情境，有三種做法。選你真的會怎麼做，再猜全班最多人選哪個。全班都答完，才一起揭曉每個做法是哪一朵花。')),
      el('div', { class: 'wait-note' }, el('button', { class: 'btn ghost small', type: 'button', onclick: () => { reseat = true; seatPick = null; view = ''; poll(); } }, '選錯座號？換一個')));
  }
  $('lobbyN').textContent = `已經有 ${st.joined} 人加入`;
}

// ---------- 作答 ----------
function renderQ() {
  const key = 'q' + st.qi;
  const s = SCENE[st.deck[st.qi]];
  const mine = st.me.answers[st.qi];
  if (view !== key) {
    view = key;
    pick = mine ? { ...mine } : { choice: null, guess: null };
    const opts = el('div', { class: 'g-opts', role: 'group', 'aria-label': '你會怎麼做' });
    s.opts.forEach((o, i) => {
      const b = el('button', { class: 'g-opt', type: 'button', 'aria-pressed': String(pick.choice === o.f) }, el('span', { class: 'lt' }, LETTERS[i]), el('span', {}, o.text));
      b.addEventListener('click', () => { pick.choice = o.f; opts.querySelectorAll('.g-opt').forEach(x => x.setAttribute('aria-pressed', String(x === b))); refreshSend(); });
      opts.append(b);
    });
    const guess = el('div', { class: 'guess', role: 'group', 'aria-label': '猜全班最多人選哪個' });
    s.opts.forEach((o, i) => {
      const b = el('button', { type: 'button', 'aria-pressed': String(pick.guess === o.f) }, el('b', {}, LETTERS[i]), el('small', {}, [...o.text.replace(/^[^，：]{1,4}：/, '').replace(/[「」]/g, '')].slice(0, 7).join('') + '…'));
      b.addEventListener('click', () => { pick.guess = o.f; guess.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); refreshSend(); });
      guess.append(b);
    });
    put(brand(), dots(),
      el('article', { class: 'paper scene' },
        el('figure', { class: 'scene-art' }, el('img', { src: sceneImg(s.id), alt: '', width: '1200', height: '675' }), el('span', { class: 'qno' }, `情境 ${st.qi + 1}`)),
        el('div', { class: 'scene-body' }, el('h1', {}, s.title), el('p', {}, s.scene))),
      el('div', { class: 'paper' }, el('h2', { class: 'sec-title' }, el('span', { class: 'no' }, '1'), '你真的會怎麼做？', el('small', {}, '沒有標準答案')), opts),
      el('div', { class: 'paper' }, el('h2', { class: 'sec-title' }, el('span', { class: 'no' }, '2'), '猜猜看：全班最多人會選哪個？', el('small', {}, '猜中得 1 分，不算進花譜')), guess),
      el('div', { id: 'sendArea' },
        el('div', { class: 'pickline', id: 'pickLine' }),
        el('div', { class: 'sent', id: 'sentBox', hidden: true }, el('div', {}, el('b', { id: 'sentTitle' }, ''), el('div', { class: 'small muted', id: 'sentSub' }, '')), el('span', { class: 'n', id: 'ansN' }, '')),
        el('div', { class: 'send-row' }, el('button', { class: 'btn mudan', type: 'button', id: 'sendBtn', onclick: send }, '送出'))));
  }
  refreshSend();
}

function refreshSend() {
  // 只改文字與狀態，不重建按鈕（重建會吃掉剛好按下去的那一下）
  const btn = $('sendBtn'); if (!btn) return;
  const mine = st.me.answers[st.qi];
  const same = mine && mine.choice === pick.choice && mine.guess === pick.guess;
  const s = SCENE[st.deck[st.qi]], L = f => LETTERS[s.opts.findIndex(o => o.f === f)];
  $('pickLine').textContent = pick.choice || pick.guess ? `我的做法：${pick.choice ? L(pick.choice) : '還沒選'}｜我猜最多人選：${pick.guess ? L(pick.guess) : '還沒猜'}` : '';
  const box = $('sentBox');
  box.hidden = !mine;
  if (mine) {
    $('sentTitle').textContent = same ? '已收到你的答案' : '你改了答案，還沒送出';
    $('sentSub').textContent = same ? '揭曉前還可以改。全班都答完就會揭曉。' : '按下面的按鈕，才會換成新的答案。';
    box.classList.toggle('changed', !same);
    $('ansN').textContent = `${st.answered} / ${st.joined}`;
  }
  const ready = pick.choice && pick.guess;
  const label = sending ? '送出中…' : !pick.choice ? '先選 ① 你的做法' : !pick.guess ? '再猜 ② 全班最多人選哪個' : mine ? (same ? '已送出' : '改成這個答案') : '送出';
  if (btn.textContent !== label) btn.textContent = label;
  btn.disabled = !ready || sending || same;
}

async function send() {
  if (sending) return;
  const qi = st.qi, snap = { ...pick };   // 送出那一刻的答案；回來時題目可能已經換了
  sending = true; setErr(''); refreshSend();
  try {
    await api(`/api/game/${code}/answer`, { body: { device: dev, qi, choice: snap.choice, guess: snap.guess } });
    if (st.qi === qi) st.me.answers[qi] = snap;
  } catch (e) { setErr(e.message); }
  sending = false;
  await poll();
}

// ---------- 揭曉 ----------
function renderReveal() {
  const key = 'r' + st.qi;
  if (view === key) return;
  view = key;
  const s = SCENE[st.deck[st.qi]];
  const res = st.results[st.qi] || { ju: 0, mudan: 0, lian: 0 };
  const t = sum3(res), top = Math.max(res.ju, res.mudan, res.lian);
  const ties = F3.filter(f => top > 0 && res[f] === top).length;
  const mine = st.me.answers[st.qi];
  const cards = s.opts.map((o, i) => {
    const F = GAME_FLOWER[o.f], n = res[o.f] || 0, fill = el('div', { class: 'fill' });
    const isMine = mine && mine.choice === o.f, isTop = top > 0 && n === top;
    const c = el('div', { class: `rv c-${o.f}${isMine ? ' is-mine' : ''}`, style: 'position:relative' },
      isTop ? el('span', { class: 'tag-top' }, ties > 1 ? '並列最多' : '全班最多') : null,
      isMine ? el('span', { class: 'tag-mine' }, '你選的') : null,
      el('div', { class: 'rv-in' },
        el('div', { class: 'rv-face rv-front' }, el('div', { class: 'lt' }, LETTERS[i]), el('div', {}, o.text)),
        el('div', { class: 'rv-face rv-back' },
          el('div', { class: 'rv-top' }, el('img', { src: flowerImg(o.f), alt: '' }), el('div', { class: 'fl' }, el('b', {}, `${LETTERS[i]} 像${F.name}`), `${F.who}・花之${F.tag}`)),
          el('div', { class: 'rv-text' }, el('span', { class: 'lt' }, LETTERS[i]), o.text),
          el('div', { class: 'rv-bar' }, el('div', { class: 'track' }, fill), el('span', { class: 'num' }, `${n} 人・${pct(n, t)}%`)),
          el('div', { class: 'rv-quote' }, `「${o.q}」`),
          el('div', { class: 'rv-gc' }, el('span', { class: 'g' }, o.good), el('span', { class: 'c' }, o.care)))));
    setTimeout(() => { c.classList.add('flip'); setTimeout(() => { fill.style.width = pct(n, t) + '%'; }, 500); }, 250 + i * 420);
    return c;
  });
  let my;
  if (!mine) my = el('div', { class: 'myline' }, '這一題你沒有作答，下一題記得選喔。');
  else {
    const mi = s.opts.findIndex(o => o.f === mine.choice), gi = s.opts.findIndex(o => o.f === mine.guess);
    const hit = top > 0 && res[mine.guess] === top;
    my = el('div', { class: 'myline' },
      el('div', {}, `你選了 ${LETTERS[mi]}（像`, el('b', { class: `c-${mine.choice} ct` }, GAME_FLOWER[mine.choice].name), `）。你猜最多人選 ${LETTERS[gi]}，`, hit ? '猜中了！' : '這次沒猜中。', el('div', { class: 'small muted' }, '想想：你當初是根據什麼猜的？')),
      el('span', { class: 'pt' }, hit ? '+1' : '＋0'));
  }
  put(brand(), dots(),
    el('h1', { style: 'font-size:clamp(26px,4.4vw,36px);letter-spacing:.08em;margin:8px 0 14px' }, `揭曉：${s.title}`),
    el('div', { class: 'rv-grid' }, ...cards),
    my,
    el('div', { class: 'talk' }, el('small', {}, '想一想'), s.talk),
    s.tip ? el('div', { class: 'tip' }, s.tip) : null,
    el('div', { class: 'layer' }, el('p', {}, el('b', {}, '課文裡　'), '周敦頤藉蓮寫出自己嚮往的君子品格；菊與牡丹，是他對隱逸者與世人的觀察。'), el('p', {}, el('b', {}, '遊戲裡　'), '我們用三朵花比喻三種做法，討論它可能的幫助和代價，不用花來評斷人。')),
    el('p', { class: 'wait-note' }, st.qi + 1 < st.deck.length ? '等老師按下一題…' : '這是最後一題，等老師打開花箋…'));
}

// ---------- 結尾：花箋＋提示詞＋Padlet ----------
const END_KEY = () => 'game_end_' + code;
let endState = null;
function loadEnd() {
  try { endState = JSON.parse(store(END_KEY()) || 'null'); } catch { endState = null; }
  endState = Object.assign({ w1: '', w2: '', qref: -1, why: '', w3: '', backup: false, style: 'gongbi', wrap: 'paper', lang: 'zh', step: 1, allStyles: false, checks: {} }, endState || {});
}
function saveEnd() { store(END_KEY(), JSON.stringify(endState)); }

function myStats() {
  const counts = { ju: 0, mudan: 0, lian: 0 };
  let hits = 0, answered = 0;
  st.deck.forEach((_, i) => {
    const a = st.me.answers[i]; if (!a) return;
    answered++; counts[a.choice]++;
    const r = st.results[i];
    if (r) { const m = Math.max(r.ju, r.mudan, r.lian); if (m > 0 && r[a.guess] === m) hits++; }
  });
  return { counts, hits, answered };
}

// 結尾分三階段：① 寫花箋 → ② 做花束 → ③ 發布互評（使用者 2026-11-20，依 Astra 審核）
const STEPS = ['寫花箋', '做花束', '發布互評'];
function renderEnd() {
  if (view === 'end') { updatePadlet(); return; }
  view = 'end';
  if (!st.me) { put(brand(), el('div', { class: 'paper' }, '這一局已經結束了。下次記得一開始就選座號加入。')); return; }
  loadEnd();
  const S = myStats();
  const top = F3.filter(f => S.counts[f] > 0).sort((a, b) => S.counts[b] - S.counts[a])[0];
  const myOpt = i => { const a = st.me.answers[i]; if (!a) return null; return SCENE[st.deck[i]].opts.find(o => o.f === a.choice); };
  if (endState.qref < 0) endState.qref = st.deck.findIndex((_, i) => st.me.answers[i]);

  // ---- 階段 1：寫花箋 ----
  const pu = el('div', { class: 'pu' }, ...F3.map(f => el('figure', { class: `c-${f}${S.counts[f] ? '' : ' zero'}`, style: `--c:${GAME_FLOWER[f].color}` },
    el('img', { src: flowerImg(f), alt: GAME_FLOWER[f].long }), el('div', { class: 'cnt' }, String(S.counts[f]), el('small', {}, GAME_FLOWER[f].name)))));
  const ratio = el('div', { class: 'ratio', 'aria-hidden': 'true' }, ...F3.filter(f => S.counts[f]).map(f => el('i', { style: `--c:${GAME_FLOWER[f].color};width:${pct(S.counts[f], S.answered)}%` })));
  const say = !top ? el('p', { class: 'pu-say' }, '你這一局沒有作答，花譜是空的；下面還是可以寫、可以做花束。')
    : topFlowers(S.counts).length > 1 ? el('p', { class: 'pu-say' }, `這一局 ${S.answered} 次選擇裡，`, el('b', { style: 'color:var(--ink)' }, topNames(S.counts)), '一樣多。')
    : el('p', { class: 'pu-say' }, `這一局 ${S.answered} 次選擇裡，最常選像`, el('b', { class: `c-${top} ct` }, GAME_FLOWER[top].long), '的做法。');
  const w1 = el('input', { type: 'text', class: 'w1', maxlength: '6', placeholder: '蓮', 'aria-label': '你喜愛的花或東西', value: endState.w1 });
  const w2 = el('input', { type: 'text', class: 'w2', maxlength: '20', placeholder: '出淤泥而不染', 'aria-label': '它的特質', value: endState.w2 });
  const qsel = el('select', { class: 'qsel', 'aria-label': '想到第幾題' }, ...st.deck.map((id, i) => el('option', { value: String(i), selected: i === endState.qref }, `第 ${i + 1} 題〈${SCENE[id].title}〉`)));
  const qopt = el('div', { class: 'qopt' });
  const why = el('input', { type: 'text', maxlength: '24', placeholder: '例如：不想讓被酸的人更難過', 'aria-label': '因為當時我想', value: endState.why });
  const w3 = el('input', { type: 'text', maxlength: '24', placeholder: '例如：先聽完大家的想法再說', 'aria-label': '如果再遇到一次，我想試著', value: endState.w3 });
  const prev = el('img', { alt: '我的三花箋預覽', width: '1080', height: '1440' });
  const saveBtn = el('button', { class: 'btn lian', type: 'button' }, '分享／儲存花箋');
  saveBtn.addEventListener('click', () => saveCard(saveBtn));

  // ---- 階段 2：做花束 ----
  const styleBtns = STYLES.map((x, i) => {
    const b = el('button', { class: 'style-opt', type: 'button', 'aria-pressed': String(endState.style === x.id) }, el('img', { src: styleImg(x.id), alt: '', loading: 'lazy', width: '300', height: '300' }), el('span', {}, x.name));
    b.addEventListener('click', () => { endState.style = x.id; styleBtns.forEach(y => y.setAttribute('aria-pressed', String(y === b))); changed(); });
    return b;
  });
  const styles = el('div', { class: 'styles', role: 'group', 'aria-label': '畫風' }, ...styleBtns);
  const more = el('button', { class: 'btn ghost small', type: 'button' }, '看全部 16 種畫風');
  const showStyles = () => {
    const sel = STYLES.findIndex(x => x.id === endState.style);
    styleBtns.forEach((b, i) => { b.hidden = !endState.allStyles && i >= 8 && i !== sel; });
    more.hidden = endState.allStyles;
  };
  more.addEventListener('click', () => { endState.allStyles = true; saveEnd(); showStyles(); });
  const wraps = el('div', { class: 'pills', role: 'group', 'aria-label': '花要怎麼放' }, ...WRAPS.map(w => {
    const b = el('button', { class: 'pill', type: 'button', 'aria-pressed': String(endState.wrap === w.id) }, w.name);
    b.addEventListener('click', () => { endState.wrap = w.id; wraps.querySelectorAll('.pill').forEach(x => x.setAttribute('aria-pressed', String(x === b))); changed(); });
    return b;
  }));

  if (!/iPad|iPhone|Macintosh/.test(navigator.userAgent) || !('ontouchend' in document)) {
    const a = el('a', { href: url, download: file.name }); document.body.append(a); a.click(); a.remove();
  }
  $('sheetImg').src = url; $('sheet').hidden = false;
}
$('sheetClose').addEventListener('click', () => { $('sheet').hidden = true; });

async function copy(text, btn, label) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch {
    const t = el('textarea', { style: 'position:fixed;top:0;left:0;opacity:0' }); t.value = text; document.body.append(t); t.select();
    try { ok = document.execCommand('copy'); } catch {} t.remove();
  }
  btn.textContent = ok ? '已複製 ✓' : '請長按文字自己複製';
  btn.classList.remove('copied'); void btn.offsetWidth; btn.classList.add('copied');
  setTimeout(() => { btn.textContent = label; }, 1800);
}

// ---------- 輪詢 ----------
async function poll() {
  clearTimeout(timer);
  if (!code) return;
  try {
    st = await api(`/api/game/${code}?device=${dev}`);
    setErr('');
    store('game_code', code);
    if ((!st.me || reseat) && st.stage !== 'end') renderSeat();
    else if (st.stage === 'lobby') renderLobby();
    else if (st.stage === 'q') { if (!st.me) renderSeat(); else renderQ(); }
    else if (st.stage === 'reveal') renderReveal();
    else renderEnd();
    const step = (reseat ? 'seat' : st.stage) + st.qi;
    if (lastStep && step !== lastStep) { window.scrollTo(0, 0); const h = app.querySelector('h1, h2'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } }
    lastStep = step;
  } catch (e) {
    if (e.code === 'no_game') { code = ''; history.replaceState(null, '', location.pathname); return renderCode(e.message); }
    setErr(e.message);
  }
  timer = setTimeout(poll, document.hidden ? 8000 : st && st.stage === 'end' ? 10000 : 3000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
function start() { view = ''; poll(); }
if (code) start(); else renderCode();
</script>
